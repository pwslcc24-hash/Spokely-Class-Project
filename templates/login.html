<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff Login — Spokely</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#222;min-height:100vh;display:flex;align-items:center;justify-content:center;}
    .login-box{background:#fff;border-radius:8px;padding:32px;width:100%;max-width:360px;box-shadow:0 2px 8px rgba(0,0,0,.1);}
    h1{margin:0 0 24px 0;font-size:1.5rem;color:#1a1a2e;}
    .form-group{margin-bottom:16px;}
    .form-group label{display:block;font-size:0.9rem;color:#444;margin-bottom:6px;}
    .form-group input{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:6px;font-size:1rem;}
    .error{background:#f8d7da;color:#721c24;padding:10px 12px;border-radius:6px;margin-bottom:16px;font-size:0.9rem;}
    .btn{padding:10px 18px;border-radius:6px;border:none;cursor:pointer;font-size:1rem;width:100%;background:#1a1a2e;color:#fff;}
    .btn:hover{background:#2d2d44;}
    .register-link{margin-top:16px;text-align:center;font-size:0.9rem;}
    .register-link a{color:#0066cc;}
  </style>
</head>
<body>
  <div class="login-box">
    <h1>Staff Login</h1>
    <p style="color:#666;margin:0 0 20px 0;">Enter your email and password to access your shop's work orders.</p>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn">Log in</button>
    </form>
    <p class="register-link">Don't have an account? <a href="{{ url_for('register') }}">Create one</a></p>
  </div>
</body>
</html>
