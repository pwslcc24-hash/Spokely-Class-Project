<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Work Order — Spokely</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;}
    body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;color:#222;}
    .app{max-width:560px;margin:0 auto;padding:24px;}
    header{background:#1a1a2e;color:#eee;padding:16px 20px;margin:-24px -24px 24px -24px;border-radius:0 0 8px 8px;}
    header h1{margin:0;font-size:1.5rem;font-weight:600;}
    header a{color:#8ab4f8;}
    .card{background:#fff;border-radius:8px;padding:24px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
    h2{font-size:1.1rem;color:#333;margin:0 0 16px 0;}
    .form-group{margin-bottom:16px;}
    .form-group label{display:block;font-size:0.9rem;color:#444;margin-bottom:6px;}
    .form-group input,.form-group select{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:6px;font-size:1rem;}
    .form-group .hint{font-size:0.8rem;color:#666;margin-top:4px;}
    .btn{padding:10px 18px;border-radius:6px;border:none;cursor:pointer;font-size:1rem;}
    .btn-primary{background:#1a1a2e;color:#fff;}
    .btn-primary:hover{background:#2d2d44;}
    .btn-secondary{background:#6c757d;color:#fff;text-decoration:none;display:inline-block;margin-left:8px;}
    .btn-secondary:hover{background:#5a6268;}
    .actions{margin-top:20px;}
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Spokely Work Orders</h1>
      <a href="{{ url_for('index') }}">← Back to dashboard</a>
    </header>

    <div class="card">
      <h2>New Work Order</h2>
      <form method="post" action="{{ url_for('add_workorder') }}">
        <div class="form-group">
          <label for="id">ID</label>
          <input type="number" id="id" name="id" min="1" step="1" value="" placeholder="Auto">
          <span class="hint">Optional. If blank, the next available ID is assigned.</span>
        </div>
        <div class="form-group">
          <label for="customer">Customer <span style="color:#c00">*</span></label>
          <input type="text" id="customer" name="customer" required>
        </div>
        <div class="form-group">
          <label for="item">Item <span style="color:#c00">*</span></label>
          <input type="text" id="item" name="item" required>
        </div>
        <div class="form-group">
          <label for="status">Status</label>
          <select id="status" name="status">
            <option value="in progress" selected>in progress</option>
            <option value="Finished">Finished</option>
          </select>
        </div>
        <div class="form-group">
          <label for="total">Total ($)</label>
          <input type="number" id="total" name="total" step="0.01" min="0" value="0" required>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Save Work Order</button>
          <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
